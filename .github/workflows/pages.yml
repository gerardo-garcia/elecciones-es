name: Publicar en GitHub Pages

# Requiere activar Pages en la repo: Settings → Pages → Source: "GitHub Actions".
# Al asociar un dominio propio, definir las variables de repo SITE_URL (https://midominio.es) y BASE_PATH (/).

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # El HTML estático depende de la fecha de construcción (fase de la portada y veda de encuestas).
    # Se reconstruye justo después de cada cambio de fase (24/11 y 29/11), y cada 3 horas entre medias.
    # El script de cliente cubre el hueco hasta que termine la reconstrucción. Horas en UTC (CET = UTC+1).
    - cron: '7 23 23 11 *' # 24-nov 00:07 CET: empieza la veda de encuestas
    - cron: '2 19 29 11 *' # 29-nov 20:02 CET: cierre de colegios, la portada pasa a recuento y termina la veda
    - cron: '12 19 29 11 *' # 29-nov 20:12 CET: repetición (GitHub puede retrasar o saltarse ejecuciones)
    - cron: '17 */3 23-30 11 *'
    - cron: '17 */3 1-8 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      # Anuncios: sin ADSENSE_CLIENT no se muestra ni se carga nada. Ver apps/web/src/lib/anuncios.ts.
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      ADSENSE_SLOT_PIE: ${{ vars.ADSENSE_SLOT_PIE }}
      ADSENSE_SLOT_LATERAL: ${{ vars.ADSENSE_SLOT_LATERAL }}
      ADSENSE_LATERALES: ${{ vars.ADSENSE_LATERALES }}
      # Titular de la web (aviso legal). Son secretos, no variables ni ficheros: el repositorio es público.
      TITULAR_NOMBRE: ${{ secrets.TITULAR_NOMBRE }}
      TITULAR_DOMICILIO: ${{ secrets.TITULAR_DOMICILIO }}
      TITULAR_CONTACTO: ${{ secrets.TITULAR_CONTACTO }}
      TITULAR_NIF: ${{ secrets.TITULAR_NIF }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
